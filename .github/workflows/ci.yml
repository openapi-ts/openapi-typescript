name: ci

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: pnpm/action-setup@v5
        with:
          run_install: true
      - run: pnpm run lint
  test-node-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v5
        with:
          run_install: true
      - run: pnpm test
  test-e2e:
    runs-on: ubuntu-latest
    # Use the official Playwright image, which ships Chromium, Firefox, WebKit and
    # every system dependency they need. That removes the
    # `playwright install --with-deps` step, which has been hanging until
    # GitHub's 6-hour job limit on every run since 2026-08-24.
    #
    # Keep the tag in sync with the `@playwright/test` version in
    # packages/openapi-fetch (currently 1.59.1).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # recommended by Playwright when running Chromium in a container
      options: --ipc=host
    # fail fast instead of occupying a runner for 6 hours if anything hangs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v5
        with:
          run_install: true
      - run: pnpm run test-e2e
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: pnpm/action-setup@v5
        with:
          run_install: true
      - run: pnpm test
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: pnpm/action-setup@v5
        with:
          run_install: true
      - run: pnpm test
